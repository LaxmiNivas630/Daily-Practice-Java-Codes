<!DOCTYPE html>
<html>
<head>
    <title>Sum of Digits</title>
</head>
<body>

<script>

let str = "hello";
let count = 0;

str = str.toLowerCase();

for (let i = 0; i < str.length; i++) {
    let ch = str[i];

    if (
        ch >= 'a' &&
        ch <= 'z' &&
        !"aeiou".includes(ch)
    ) {
        count++;
    }
}

console.log("Consonants:", count);

</script>

</body>
</html>
