<html>
    <body>
        <script>
            let numbers = [7, 12, 0, 15, 22, 9];

for (let i = 0; i < numbers.length; i++) {

    if (numbers[i] % 2 == 0) {
        console.log(numbers[i] + " is Even");
    } else {
        console.log(numbers[i] + " is Odd");
    }

}
        </script>
    </body>
</html>
