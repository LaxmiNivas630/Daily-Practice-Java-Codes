<!DOCTYPE html>
<html>
    <head>
        <title>Button Click Counter</title>
    </head>
        <body>

        
                <script>
                    let n=5;
                    let a=0;
                    let b=1;

                    for(let i=1;i<=n;i++){
                        console.log(a);
                        let c = a+b;
                        a=b;
                        b=c;
                        

                    }
                </script>

        </body>
 </html>
